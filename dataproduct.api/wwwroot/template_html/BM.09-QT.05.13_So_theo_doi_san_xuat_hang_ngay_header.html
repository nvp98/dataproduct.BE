<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      @page {
        margin: 18mm;
      }

      body {
        font-family: "Times New Roman", serif;
        font-size: 10pt;
        color: #000;
        margin: 0;
      }

      .header {
        display: table;
        width: 100%;
        margin-bottom: 18mm;
      }

      .header-left {
        display: table-cell;
        width: 50%;
        vertical-align: middle;
      }

      .header-left img {
        max-height: 60px;
      }

      .header-right {
        display: table-cell;
        width: 50%;
        vertical-align: middle;
        text-align: right;
        font-size: 8pt;
        line-height: 1.5;
      }

      .title {
        text-align: center;
        font-size: 14pt;
        font-weight: bold;
        margin: 3px 0 0 0;
        text-transform: uppercase;
      }

      .sub-title {
        text-align: center;
        font-style: italic;
        font-size: 9.5pt;
        margin: 1px 0;
      }

      .header-divider {
        /* border-bottom: 1px solid #000; */
        margin-top: 3px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="{{LogoUrl}}" alt="Logo Hoa Phat" />
      </div>
      <div class="header-right">
        {{MaBM}}<br />
        Ngày hiệu lực: {{NgayHieuLuc}}<br />
        Lần sửa đổi: {{LanSuaDoi}}
      </div>
    </div>

    <div class="title">Sổ theo dõi</div>
    <div class="title">Sản xuất hàng ngày</div>
    <div class="sub-title">
      Kíp {{KipCa}} từ {{TuGio}} ngày {{TuNgay}} đến {{DenGio}} ngày {{DenNgay}}
    </div>
    <div class="sub-title">(Do nhân viên vận hành pupit 1 theo dõi)</div>

    <div class="header-divider"></div>
  </body>
</html>
