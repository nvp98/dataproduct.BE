<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>{{TenBieuMau}}</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 18mm;
      }

      body {
        font-family: "Times New Roman", serif;
        font-size: 9pt;
        color: #000;
      }

      .header {
        display: table;
        width: 100%;
        margin-bottom: 18mm;
      }

      .header-left {
        display: table-cell;
        width: 50%;
        vertical-align: middle;
      }

      .header-left img {
        max-height: 60px;
      }

      .header-right {
        display: table-cell;
        width: 50%;
        vertical-align: middle;
        text-align: right;
        font-size: 8pt;
        line-height: 1.5;
      }

      .title {
        text-align: center;
        font-size: 13pt;
        font-weight: bold;
        margin: 4px 0;
      }

      .subtitle {
        text-align: center;
        font-style: italic;
        font-size: 9pt;
        margin-bottom: 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 4px;
      }

      th,
      td {
        border: 1px solid #000;
        padding: 2px 3px;
        text-align: center;
        vertical-align: middle;
        font-size: 7.5pt;
      }

      th {
        background-color: #e0e0e0;
        font-weight: bold;
      }

      .td-left {
        text-align: left;
      }

      .total-row td {
        font-weight: bold;
        background-color: #f0f0f0;
      }

      /* Footer table */
      .footer-tbl {
        margin-top: 8px;
        border-collapse: collapse;
        width: 100%;
      }

      .footer-tbl th,
      .footer-tbl td {
        border: 1px solid #000;
        padding: 2px 4px;
        font-size: 7.5pt;
      }

      .footer-tbl th {
        background-color: #e0e0e0;
        font-weight: bold;
        text-align: center;
      }

      /* Outer medium border */
      .footer-tbl tr:first-child th,
      .footer-tbl tr:first-child td {
        border-top: 1px solid #000;
      }

      .footer-tbl tr:last-child th,
      .footer-tbl tr:last-child td {
        border-bottom: 1px solid #000;
      }

      .footer-tbl tr > th:first-child,
      .footer-tbl tr > td:first-child {
        border-left: 1px solid #000;
      }

      .footer-tbl tr > th:last-child,
      .footer-tbl tr > td:last-child {
        border-right: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <!-- HEADER (rows 1-3 equivalent) -->
    <div class="header">
      <div class="header-left">
        <img src="{{LogoUrl}}" alt="Logo" />
      </div>
      <div class="header-right">
        {{BmCode}}
      </div>
    </div>

    <!-- TITLE (row 4) -->
    <div class="title">{{TenBieuMau}}</div>

    <!-- INFO KÍP (row 5) -->
    <div class="subtitle">{{InfoKip}}</div>

    <!-- DATA TABLE (rows 6-7 headers + rows 8+ data) -->
    <table>
      {{TheadRows}}
      {{TbodyRows}}
    </table>

    <!-- FOOTER (sau 1 dòng trắng) -->
    {{FooterHtml}}
  </body>
</html>
